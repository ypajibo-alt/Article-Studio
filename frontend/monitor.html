<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor — Article Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6f8; color: #1a1a1a; min-height: 100vh; display: flex;
    }

    .dossier-sidebar {
      width: 200px; min-width: 200px; background: #1E1E2D;
      display: flex; flex-direction: column; padding: 12px;
      height: 100vh; position: sticky; top: 0; flex-shrink: 0;
    }
    .ds-logo { display: flex; align-items: center; gap: 10px; padding: 14px 12px 22px; }
    .ds-logo span { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    .ds-nav { display: flex; flex-direction: column; gap: 2px; }
    .ds-nav-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px;
      color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .ds-nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
    .ds-nav-item.active { background: #7C3AED; color: #fff; }
    .ds-icon { width: 18px; height: 18px; flex-shrink: 0; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    .topbar {
      padding: 20px 32px 16px; border-bottom: 1px solid #e2e4e8; background: #fff;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .topbar-left h1 { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
    .topbar-left p { font-size: 13px; color: #8b919a; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }

    .refresh-btn {
      padding: 7px 14px; border-radius: 8px; border: 1px solid #e2e4e8;
      background: #fff; font-size: 13px; font-weight: 600; color: #6b7280;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
      display: flex; align-items: center; gap: 6px;
    }
    .refresh-btn:hover { border-color: #c4b5fd; color: #7C3AED; }
    .refresh-btn:disabled { opacity: 0.4; cursor: default; }
    .fetched-at { font-size: 12px; color: #9ca3af; }

    .summary-bar {
      display: flex; gap: 12px; padding: 14px 32px; background: #fff;
      border-bottom: 1px solid #e2e4e8; flex-shrink: 0; display: none;
    }
    .summary-chip {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 13px; border-radius: 99px; font-size: 13px; font-weight: 600;
      border: 1px solid transparent; cursor: pointer; transition: opacity 0.15s;
    }
    .summary-chip:hover { opacity: 0.8; }
    .summary-chip.dimmed { opacity: 0.4; }
    .chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .chip-critical { background: rgba(239,68,68,0.08); color: #dc2626; border-color: rgba(239,68,68,0.2); }
    .chip-critical .chip-dot { background: #ef4444; }
    .chip-warning { background: rgba(245,158,11,0.08); color: #d97706; border-color: rgba(245,158,11,0.2); }
    .chip-warning .chip-dot { background: #f59e0b; }
    .chip-ok { background: rgba(22,163,74,0.08); color: #16a34a; border-color: rgba(22,163,74,0.2); }
    .chip-ok .chip-dot { background: #22c55e; }
    .chip-stale { background: rgba(124,58,237,0.08); color: #7c3aed; border-color: rgba(124,58,237,0.2); }
    .chip-stale .chip-dot { background: #8b5cf6; }
    .chip-unknown { background: #f3f4f6; color: #6b7280; border-color: #e5e7eb; }
    .chip-unknown .chip-dot { background: #d1d5db; }

    .filter-tabs {
      display: flex; gap: 2px; padding: 12px 32px 0; background: #fff;
      border-bottom: 1px solid #e2e4e8; flex-shrink: 0;
    }
    .filter-tab {
      padding: 8px 14px; border-radius: 6px 6px 0 0; font-size: 13px; font-weight: 600;
      color: #6b7280; cursor: pointer; border: none; background: none; font-family: inherit;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .filter-tab:hover { color: #374151; }
    .filter-tab.active { color: #7C3AED; border-bottom-color: #7C3AED; }

    .content { flex: 1; overflow-y: auto; padding: 24px 32px; }

    .loading-state { text-align: center; padding: 60px; color: #9ca3af; font-size: 14px; }
    .loading-spinner {
      width: 28px; height: 28px; border: 3px solid #e2e4e8; border-top-color: #7C3AED;
      border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-state { color: #ef4444; font-size: 14px; padding: 32px; text-align: center; }

    /* Article cards */
    .article-card {
      background: #fff; border: 1px solid #e2e4e8; border-radius: 12px;
      margin-bottom: 8px; overflow: hidden;
    }
    .article-card.status-critical { border-left: 3px solid #ef4444; }
    .article-card.status-warning  { border-left: 3px solid #f59e0b; }
    .article-card.status-stale    { border-left: 3px solid #8b5cf6; }
    .article-card.status-ok       { border-left: 3px solid #22c55e; }
    .article-card.status-unknown  { border-left: 3px solid #d1d5db; }

    .card-header {
      display: flex; align-items: center; gap: 12px; padding: 13px 18px;
      cursor: pointer; user-select: none;
    }
    .card-header:hover { background: #fafafa; }

    .card-status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .dot-critical { background: #ef4444; }
    .dot-warning  { background: #f59e0b; }
    .dot-stale    { background: #8b5cf6; }
    .dot-ok       { background: #22c55e; }
    .dot-unknown  { background: #d1d5db; }

    .card-title { flex: 1; font-size: 14px; font-weight: 600; color: #1a1a1a; line-height: 1.3; }

    .card-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .type-badge {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    }
    .type-listicle { background: rgba(124,58,237,0.08); color: #7C3AED; }
    .type-single   { background: rgba(0,181,163,0.08); color: #00938a; }
    .type-worldcup { background: rgba(245,158,11,0.1); color: #b45309; }

    .badge {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700;
    }
    .badge-critical { background: rgba(239,68,68,0.1); color: #dc2626; }
    .badge-warning  { background: rgba(245,158,11,0.1); color: #d97706; }

    .chevron {
      width: 15px; height: 15px; color: #c4c9d1; transition: transform 0.2s; flex-shrink: 0;
    }
    .chevron.open { transform: rotate(90deg); }

    /* Items panel */
    .items-panel { display: none; border-top: 1px solid #f0f1f3; }
    .items-panel.open { display: block; }

    .items-table { width: 100%; border-collapse: collapse; }
    .items-table th {
      text-align: left; font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: #9ca3af; padding: 9px 18px; background: #fafafa;
      border-bottom: 1px solid #f0f1f3;
    }
    .items-table td { padding: 9px 18px; border-bottom: 1px solid #f9fafb; vertical-align: top; }
    .items-table tr:last-child td { border-bottom: none; }
    .items-table tr:hover td { background: #fafafa; }

    .item-pos  { font-size: 12px; font-weight: 700; color: #c4c9d1; width: 20px; padding-right: 4px; }
    .item-title-text { font-size: 13px; font-weight: 600; color: #1a1a1a; }
    .item-content-text { font-size: 11px; color: #6b7280; margin-top: 1px; }
    .expiry-critical { color: #dc2626; font-size: 12px; font-weight: 600; }
    .expiry-warning  { color: #d97706; font-size: 12px; font-weight: 600; }
    .expiry-stale    { color: #7c3aed; font-size: 12px; font-weight: 600; }
    .expiry-ok       { color: #16a34a; font-size: 12px; }
    .expiry-expired  { color: #7f1d1d; font-size: 12px; font-weight: 700; }
    .expiry-unknown  { color: #c4c9d1; font-size: 12px; }

    /* Suggestion row — expands below the flagged item row */
    .suggestion-row td { padding: 0 18px 12px 52px; background: #fffbeb; border-bottom: 1px solid #f0f1f3; }
    .suggestion-row.hidden { display: none; }
    .suggestion-header { font-size: 11px; font-weight: 700; color: #92400e; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .suggestion-cards { display: flex; gap: 8px; flex-wrap: wrap; }
    .suggestion-card {
      border: 1px solid #fde68a; border-radius: 8px; padding: 10px 12px;
      background: #fff; min-width: 180px; max-width: 220px; flex: 1;
      cursor: default;
    }
    .suggestion-card-title { font-size: 13px; font-weight: 700; color: #1a1a1a; margin-bottom: 2px; }
    .suggestion-card-meta { font-size: 11px; color: #6b7280; margin-bottom: 6px; }
    .suggestion-card-expiry { font-size: 11px; color: #16a34a; font-weight: 600; }
    .suggestion-card-expiry.none { color: #9ca3af; }
    .suggest-btn {
      padding: 4px 10px; border-radius: 6px; border: 1px solid #e2e4e8;
      background: #fff; font-size: 11px; font-weight: 600; color: #6b7280;
      cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
    }
    .suggest-btn:hover { border-color: #f59e0b; color: #92400e; background: #fffbeb; }
    .suggest-btn:disabled { opacity: 0.4; cursor: default; }
    .suggest-loading { font-size: 12px; color: #92400e; font-style: italic; padding: 4px 0; }
    .suggestion-empty { font-size: 12px; color: #9ca3af; padding: 4px 0; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
      opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 200;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #00B5A3; }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>

  <div class="ds-logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>

  </div>
  <nav class="ds-nav">

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Monitor</h1>
      <p>Expiry tracking across all live blog articles</p>
    </div>
    <div class="topbar-right">
      <span class="fetched-at" id="fetched-at"></span>
      <button class="refresh-btn" id="refresh-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <div class="summary-bar" id="summary-bar">
    <div class="summary-chip chip-critical" data-filter="critical"><div class="chip-dot"></div><span id="count-critical">0</span> critical</div>
    <div class="summary-chip chip-warning"  data-filter="warning"><div class="chip-dot"></div><span id="count-warning">0</span> warning</div>
    <div class="summary-chip chip-stale"    data-filter="stale"><div class="chip-dot"></div><span id="count-stale">0</span> now live</div>
    <div class="summary-chip chip-ok"       data-filter="ok"><div class="chip-dot"></div><span id="count-ok">0</span> ok</div>
    <div class="summary-chip chip-unknown"  data-filter="unknown"><div class="chip-dot"></div><span id="count-unchecked">0</span> not checked</div>
    <button class="refresh-btn" id="check-all-btn" onclick="checkAllAvailability()" style="margin-left:auto">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
      Check all availability
    </button>
  </div>

  <div class="filter-tabs">
    <button class="filter-tab active" data-filter="all">All</button>
    <button class="filter-tab" data-filter="critical">Critical</button>
    <button class="filter-tab" data-filter="warning">Warning</button>
    <button class="filter-tab" data-filter="ok">OK</button>
    <button class="filter-tab" data-filter="listicle">Listicles</button>
    <button class="filter-tab" data-filter="single">Single titles</button>
    <button class="filter-tab" data-filter="worldcup">World Cup</button>
  </div>

  <div class="content" id="content">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      Loading article data...
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>window.__ARTICLES__ = null;</script>
<script>
  const API = '';
  let allArticles = [];
  let activeFilter = 'all';
  // availMap: contentId → { status, daysLeft, availability_ends }
  const availMap = {};
  // track which articles have had availability checked
  const checkedArticles = new Set();

  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => t.className = 'toast', 2800);
  }

  function formatExpiry(contentId) {
    const a = availMap[contentId];
    if (!a) return `<span class="expiry-unknown">—</span>`;
    const { status, daysLeft, startsIn, availability_starts } = a;
    if (status === 'stale')                     return `<span class="expiry-stale">Just launched — refresh article</span>`;
    if (startsIn !== null && startsIn > 0)       return `<span class="expiry-warning">Coming soon — arrives in ${startsIn}d</span>`;
    if (status === 'expired')                   return `<span class="expiry-expired">Expired</span>`;
    if (status === 'ok' && daysLeft === null)    return `<span class="expiry-ok">Permanent</span>`;
    if (daysLeft === 0)                         return `<span class="expiry-critical">Expires today</span>`;
    if (daysLeft === 1)                         return `<span class="expiry-critical">Tomorrow</span>`;
    if (status === 'critical')                  return `<span class="expiry-critical">${daysLeft}d left</span>`;
    if (status === 'warning')                   return `<span class="expiry-warning">${daysLeft}d left</span>`;
    return `<span class="expiry-ok">${daysLeft}d</span>`;
  }

  function itemStatus(contentId) {
    return availMap[contentId]?.status ?? 'unknown';
  }

  function articleComputedStatus(article) {
    const items = article.items.filter(i => i.contentId);
    if (!items.length) return 'unknown';
    const statuses = items.map(i => itemStatus(i.contentId));
    if (statuses.every(s => s === 'unknown')) return 'pending';
    if (statuses.some(s => s === 'critical' || s === 'expired')) return 'critical';
    if (statuses.some(s => s === 'warning')) return 'warning';
    if (statuses.some(s => s === 'stale')) return 'stale';
    return 'ok';
  }

  function typeBadge(articleType) {
    const map = { listicle: ['Listicle','type-listicle'], single: ['Single','type-single'], worldcup: ['World Cup','type-worldcup'] };
    const [label, cls] = map[articleType] || ['?','type-single'];
    return `<span class="type-badge ${cls}">${label}</span>`;
  }

  function renderItemRows(article) {
    return article.items.map(item => {
      const st = itemStatus(item.contentId);
      const needsFlag = st === 'critical' || st === 'warning' || st === 'expired';
      return `
        <tr>
          <td class="item-pos">${item.position}</td>
          <td>
            <div class="item-title-text">${esc(item.title)}</div>
            ${item.content_title && item.content_title !== item.title ? `<div class="item-content-text">${esc(item.content_title)}</div>` : ''}
          </td>
          <td style="white-space:nowrap">${formatExpiry(item.contentId)}</td>
          <td style="text-align:right">
            ${needsFlag ? `<button class="suggest-btn" onclick="toggleSuggestions(event,'${esc(article.id)}',${item.position})">Suggest replacement</button>` : ''}
          </td>
        </tr>
        ${needsFlag ? `
        <tr class="suggestion-row hidden" id="sugg-${esc(article.id)}-${item.position}">
          <td colspan="4">
            <div class="suggestion-header">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              Replacement suggestions for "${esc(item.title)}"
            </div>
            <div class="suggestion-cards" id="sugg-cards-${esc(article.id)}-${item.position}">
              <span class="suggest-loading">Loading suggestions...</span>
            </div>
          </td>
        </tr>` : ''}`;
    }).join('');
  }

  function renderArticles(articles) {
    const content = document.getElementById('content');
    if (!articles.length) {
      content.innerHTML = '<div class="loading-state" style="color:#9ca3af;padding-top:48px">No articles match this filter.</div>';
      return;
    }

    content.innerHTML = articles.map(article => {
      const hasItems = article.itemCount > 0;
      const checked = checkedArticles.has(article.id);
      const st = checked ? articleComputedStatus(article) : 'pending';
      const statusClass = st === 'pending' ? 'status-unknown' : `status-${st}`;
      const dotClass = st === 'pending' ? 'dot-unknown' : `dot-${st}`;

      const criticalCount = checked ? article.items.filter(i => { const s = itemStatus(i.contentId); return s === 'critical' || s === 'expired'; }).length : 0;
      const warningCount  = checked ? article.items.filter(i => itemStatus(i.contentId) === 'warning').length : 0;

      let panelContent;
      if (!hasItems) {
        panelContent = `<div style="padding:12px 18px;font-size:12px;color:#9ca3af">No trackable titles in this article.</div>`;
      } else {
        const tbodyContent = checked ? renderItemRows(article) : `
          <tr><td colspan="4" style="padding:14px 18px">
            <button class="refresh-btn" style="font-size:12px" onclick="checkAvailability(event,'${esc(article.id)}')">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
              Check availability
            </button>
          </td></tr>`;
        panelContent = `<table class="items-table">
          <thead><tr><th>#</th><th>Title</th><th>Expiry</th><th></th></tr></thead>
          <tbody id="rows-${esc(article.id)}">${tbodyContent}</tbody>
        </table>`;
      }

      return `
      <div class="article-card ${statusClass}" id="card-${esc(article.id)}">
        <div class="card-header" onclick="toggleCard('${esc(article.id)}')">
          <div class="card-status-dot ${dotClass}"></div>
          <div class="card-title">${esc(article.title)}</div>
          <div class="card-meta">
            ${typeBadge(article.articleType)}
            ${criticalCount > 0 ? `<span class="badge badge-critical">${criticalCount} critical</span>` : ''}
            ${warningCount > 0  ? `<span class="badge badge-warning">${warningCount} expiring</span>` : ''}
            ${hasItems ? `<span style="font-size:11px;color:#c4c9d1">${article.itemCount}</span>` : ''}
            <svg class="chevron" id="chevron-${esc(article.id)}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
          </div>
        </div>
        <div class="items-panel" id="panel-${esc(article.id)}">${panelContent}</div>
      </div>`;
    }).join('');
  }

  function toggleCard(id) {
    const panel = document.getElementById('panel-' + id);
    const chevron = document.getElementById('chevron-' + id);
    const isOpen = panel.classList.contains('open');
    panel.classList.toggle('open', !isOpen);
    chevron.classList.toggle('open', !isOpen);
  }

  async function checkAvailability(event, articleId) {
    event.stopPropagation();
    const article = allArticles.find(a => a.id === articleId);
    if (!article) return;
    const contentIds = article.items.map(i => i.contentId).filter(Boolean);
    if (!contentIds.length) return;

    const tbody = document.getElementById('rows-' + articleId);
    if (tbody) tbody.innerHTML = `<tr><td colspan="4" style="padding:14px 18px;font-size:12px;color:#9ca3af">Checking availability…</td></tr>`;

    try {
      const resp = await fetch(`${API}/api/monitor/check-availability`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contentIds }),
      });
      const data = await resp.json();
      for (const item of (data.items || [])) {
        availMap[item.contentId] = item;
      }
      checkedArticles.add(articleId);
      updateSummaryChips();

      // Re-render just this card's rows and status
      const card = document.getElementById('card-' + articleId);
      if (card && tbody) {
        tbody.innerHTML = renderItemRows(article);
        const st = articleComputedStatus(article);
        card.className = `article-card status-${st}`;
        const dot = card.querySelector('.card-status-dot');
        if (dot) dot.className = `card-status-dot dot-${st}`;
        const criticalCount = article.items.filter(i => { const s = itemStatus(i.contentId); return s === 'critical' || s === 'expired'; }).length;
        const warningCount  = article.items.filter(i => itemStatus(i.contentId) === 'warning').length;
        const meta = card.querySelector('.card-meta');
        // update badges
        meta.querySelectorAll('.badge').forEach(b => b.remove());
        if (criticalCount > 0) meta.insertBefore(Object.assign(document.createElement('span'), { className: 'badge badge-critical', textContent: `${criticalCount} critical` }), meta.querySelector('.chevron'));
        if (warningCount > 0)  meta.insertBefore(Object.assign(document.createElement('span'), { className: 'badge badge-warning',  textContent: `${warningCount} expiring` }),  meta.querySelector('.chevron'));
      }
    } catch (err) {
      if (tbody) tbody.innerHTML = `<tr><td colspan="4" style="padding:14px 18px;font-size:12px;color:#ef4444">Error: ${esc(err.message)}</td></tr>`;
    }
  }

  const suggestionCache = {};

  async function toggleSuggestions(event, articleId, position) {
    event.stopPropagation();
    const rowId = `sugg-${articleId}-${position}`;
    const row = document.getElementById(rowId);
    if (!row) return;
    const isHidden = row.classList.contains('hidden');
    row.classList.toggle('hidden', !isHidden);
    if (!isHidden) return;

    const cacheKey = `${articleId}-${position}`;
    if (suggestionCache[cacheKey]) return;

    const article = allArticles.find(a => a.id === articleId);
    const item = article?.items.find(i => i.position === position);
    if (!item) return;

    try {
      const resp = await fetch(`${API}/api/monitor/suggest-replacement`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contentTitle: item.content_title || item.title, contentType: '', articleTitle: article.title, contentId: item.contentId, isComingSoon: (availMap[item.contentId]?.startsIn ?? 0) > 0 }),
      });
      const data = await resp.json();
      const cards = document.getElementById(`sugg-cards-${articleId}-${position}`);
      if (!cards) return;
      if (!data.suggestions?.length) {
        cards.innerHTML = '<span class="suggestion-empty">No suitable replacements found on Tubi right now.</span>';
      } else {
        cards.innerHTML = data.suggestions.map(s => {
          const expiryText = s.startsIn > 0
            ? `<span class="suggestion-card-expiry" style="color:#7c3aed">Arrives in ${s.startsIn}d</span>`
            : s.daysLeft === null ? '<span class="suggestion-card-expiry none">No expiry date</span>'
            : `<span class="suggestion-card-expiry">${s.daysLeft}d available</span>`;
          const tubiUrl = `https://tubitv.com/${s.type === 'Series' ? 'series' : 'movies'}/${s.contentId}`;
          const generateUrl = `/generate?contentId=${encodeURIComponent(s.contentId)}`;
          return `<div class="suggestion-card">
            <div class="suggestion-card-title">${esc(s.title)}</div>
            <div class="suggestion-card-meta">${esc(s.type)}${s.year ? ' · ' + s.year : ''}</div>
            ${expiryText}
            <div style="margin-top:10px;display:flex;flex-direction:column;gap:5px">
              <a href="${esc(generateUrl)}" target="_blank" style="font-size:11px;background:#7C3AED;color:#fff;font-weight:600;text-decoration:none;padding:5px 10px;border-radius:5px;display:inline-block;text-align:center">Generate article →</a>
              <a href="${esc(tubiUrl)}" target="_blank" style="font-size:11px;color:#7C3AED;font-weight:600;text-decoration:none">View on Tubi ↗</a>
            </div>
          </div>`;
        }).join('');
      }
      suggestionCache[cacheKey] = true;
    } catch (err) {
      const cards = document.getElementById(`sugg-cards-${articleId}-${position}`);
      if (cards) cards.innerHTML = `<span class="suggestion-empty">Error: ${esc(err.message)}</span>`;
    }
  }

  function updateSummaryChips() {
    const checked = allArticles.filter(a => checkedArticles.has(a.id));
    document.getElementById('count-critical').textContent = checked.filter(a => articleComputedStatus(a) === 'critical').length;
    document.getElementById('count-warning').textContent  = checked.filter(a => articleComputedStatus(a) === 'warning').length;
    document.getElementById('count-stale').textContent    = checked.filter(a => articleComputedStatus(a) === 'stale').length;
    document.getElementById('count-ok').textContent       = checked.filter(a => articleComputedStatus(a) === 'ok').length;
    document.getElementById('count-unchecked').textContent = allArticles.length - checkedArticles.size;
  }

  async function checkAllAvailability() {
    const btn = document.getElementById('check-all-btn');
    btn.disabled = true;
    btn.textContent = 'Checking…';

    // Collect all unique content IDs across all articles
    const allIds = [...new Set(
      allArticles.flatMap(a => a.items.map(i => i.contentId).filter(Boolean))
    )];

    try {
      const resp = await fetch(`${API}/api/monitor/check-availability`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contentIds: allIds }),
      });
      const data = await resp.json();
      for (const item of (data.items || [])) availMap[item.contentId] = item;
    } catch (e) { console.error('check-all failed', e); }

    // Mark all articles checked and update cards
    for (const article of allArticles) {
      checkedArticles.add(article.id);
      const card = document.getElementById('card-' + article.id);
      if (card) {
        const st = articleComputedStatus(article);
        card.className = `article-card status-${st}`;
        card.querySelector('.card-status-dot').className = `card-status-dot dot-${st}`;
        const tbody = document.getElementById('rows-' + article.id);
        if (tbody) tbody.innerHTML = renderItemRows(article);
      }
    }

    updateSummaryChips();
    btn.disabled = false;
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 0 0 4.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 0 1-15.357-2m15.357 2H15"/></svg> Re-check`;
  }

  function applyFilter() {
    let filtered = allArticles;
    if (activeFilter === 'critical') filtered = allArticles.filter(a => articleComputedStatus(a) === 'critical');
    else if (activeFilter === 'warning') filtered = allArticles.filter(a => articleComputedStatus(a) === 'warning');
    else if (activeFilter === 'stale') filtered = allArticles.filter(a => articleComputedStatus(a) === 'stale');
    else if (activeFilter === 'ok') filtered = allArticles.filter(a => articleComputedStatus(a) === 'ok');
    else if (activeFilter === 'listicle') filtered = allArticles.filter(a => a.articleType === 'listicle');
    else if (activeFilter === 'single') filtered = allArticles.filter(a => a.articleType === 'single');
    else if (activeFilter === 'worldcup') filtered = allArticles.filter(a => a.articleType === 'worldcup');
    renderArticles(filtered);
  }

  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeFilter = tab.dataset.filter;
      applyFilter();
    });
  });

  document.querySelectorAll('.summary-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const filter = chip.dataset.filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.toggle('active', t.dataset.filter === filter));
      activeFilter = filter;
      applyFilter();
    });
  });

  function loadData() {
    try {
      allArticles = window.__ARTICLES__ || [];
      if (!allArticles.length) {
        document.getElementById('content').innerHTML = '<div class="error-state">No articles loaded — data injection failed.</div>';
        return;
      }
      document.getElementById('summary-bar').style.display = 'flex';
      document.getElementById('fetched-at').textContent = `${allArticles.length} articles`;
      updateSummaryChips();
      applyFilter();
      checkAllAvailability();
    } catch(e) {
      document.getElementById('content').innerHTML = `<div class="error-state">JS Error: ${esc(String(e))}</div>`;
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', () => window.location.reload());
  loadData();
</script>
</body>
</html>
