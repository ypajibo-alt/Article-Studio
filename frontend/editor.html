<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Editor — Article Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff; color: #1a1a1a; min-height: 100vh; display: flex;
    }

    /* Sidebar */
    .dossier-sidebar {
      width: 200px; min-width: 200px; background: #1E1E2D;
      display: flex; flex-direction: column; padding: 12px;
      height: 100vh; position: sticky; top: 0; flex-shrink: 0;
    }
    .ds-logo { display: flex; align-items: center; gap: 10px; padding: 14px 12px 22px; }
    .ds-logo span { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    .ds-nav { display: flex; flex-direction: column; gap: 2px; }
    .ds-nav-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px;
      color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .ds-nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
    .ds-nav-item.active { background: #7C3AED; color: #fff; }
    .ds-icon { width: 18px; height: 18px; flex-shrink: 0; }

    /* Main */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }

    /* Top bar */
    .topbar {
      padding: 14px 32px; border-bottom: 1px solid #f0f1f3;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0; gap: 16px;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: #9ca3af; text-decoration: none; transition: color 0.15s;
    }
    .back-link:hover { color: #1a1a1a; }
    .topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn-save {
      padding: 7px 16px; border-radius: 8px; border: none;
      background: #00B5A3; color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background 0.15s;
    }
    .btn-save:hover { background: #009e8e; }
    .btn-save:disabled { background: #d1d5db; cursor: default; }

    .status-dropdown { position: relative; display: inline-block; }
    .status-dropdown-menu {
      display: none; position: absolute; top: calc(100% + 6px); left: 0;
      background: #fff; border: 1px solid #e2e4e8; border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 100; min-width: 160px; overflow: hidden;
    }
    .status-dropdown-menu.open { display: block; }
    .status-dropdown-item {
      padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; gap: 8px; color: #374151;
      transition: background 0.1s;
    }
    .status-dropdown-item:hover { background: #f9fafb; }
    .status-dropdown-item.active { font-weight: 700; }

    .btn-publish {
      padding: 7px 16px; border-radius: 8px; border: none;
      background: #16a34a; color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: background 0.15s;
    }
    .btn-publish:hover { background: #15803d; }
    .btn-publish.published { background: #f3f4f6; color: #6b7280; border: 1px solid #e2e4e8; }
    .btn-publish.published:hover { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }
    .btn-publish:disabled { opacity: 0.4; cursor: default; }

    .btn-export {
      padding: 7px 16px; border-radius: 8px; border: 1px solid #e2e4e8;
      background: #fff; color: #374151; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-export:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn-export:disabled { opacity: 0.4; cursor: default; }

    /* Article header */
    .article-header { padding: 24px 32px 0; }
    .article-headline-edit {
      font-size: 24px; font-weight: 800; line-height: 1.2; color: #1a1a1a;
      margin-bottom: 10px; outline: none; border-radius: 4px;
      transition: background 0.15s;
    }
    .article-headline-edit:hover { background: #f9fafb; }
    .article-headline-edit:focus { background: #f0f9ff; }
    .article-headline-edit[data-placeholder]:empty::before {
      content: attr(data-placeholder); color: #c0c4cb;
    }

    /* Metadata bar */
    .meta-bar {
      display: flex; align-items: center; flex-wrap: wrap; gap: 0;
      margin-bottom: 12px; font-size: 13px; color: #1a1a1a;
    }
    .meta-item { display: flex; align-items: center; gap: 5px; }
    .meta-label { color: #6b7280; }
    .meta-div { width: 1px; height: 13px; background: #e2e4e8; margin: 0 12px; flex-shrink: 0; }

    .status-badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 11px; font-weight: 700;
    }
    .s-draft       { background: #f3f4f6; color: #6b7280; }
    .s-ready       { background: rgba(0,181,163,0.1); color: #00B5A3; }
    .s-legal       { background: rgba(245,158,11,0.1); color: #d97706; }
    .s-mkt         { background: rgba(124,58,237,0.1); color: #7C3AED; }
    .s-approved    { background: rgba(34,197,94,0.1); color: #16a34a; }
    .s-unpublished { background: #f3f4f6; color: #9ca3af; }

    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
    .tag {
      padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600;
      background: rgba(124,58,237,0.08); color: #7C3AED;
    }

    /* Tabs */
    .tabs-row {
      display: flex; align-items: flex-end; justify-content: space-between;
      border-bottom: 1px solid #e2e4e8; padding: 0 32px; margin-top: 12px;
    }
    .tab-bar { display: flex; gap: 0; margin-bottom: -1px; }
    .tab {
      padding: 8px 18px; border: 1px solid transparent; border-bottom: none;
      border-radius: 6px 6px 0 0; background: none; font-size: 13px; font-weight: 500;
      color: #6b7280; cursor: pointer; font-family: inherit; transition: all 0.1s;
    }
    .tab:hover { background: #f9fafb; color: #1a1a1a; }
    .tab.active { color: #1a1a1a; font-weight: 600; background: #fff; border-color: #e2e4e8; border-bottom-color: #fff; }
    .tab .feedback-badge {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #ef4444; margin-left: 5px; vertical-align: middle;
    }
    .tab-status { font-size: 12px; color: #9ca3af; padding-bottom: 10px; }

    /* Tab panes */
    .tab-pane { display: none; flex: 1; min-height: 0; overflow: hidden; }
    .tab-pane.active { display: flex; }

    /* Workspace split: article + comments */
    .ws-article { flex: 1; overflow-y: auto; padding: 28px 32px; }
    .ws-comments {
      width: 300px; min-width: 300px; border-left: 1px solid #f0f1f3;
      display: flex; flex-direction: column; overflow: hidden;
      flex-shrink: 0;
    }
    .ws-comments.empty { display: none; }
    .ws-comments-header {
      padding: 14px 18px; border-bottom: 1px solid #f0f1f3;
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #9ca3af; flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .ws-comments-list { flex: 1; overflow-y: auto; padding: 10px; }
    .ws-comment-card {
      border: 1px solid #f0f1f3; border-radius: 8px; padding: 10px 12px;
      margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
      border-left: 3px solid #e2e4e8;
    }
    .ws-comment-card.from-legal { border-left-color: #d97706; }
    .ws-comment-card.from-marketing { border-left-color: #6366f1; }
    .ws-comment-card.resolved { opacity: 0.4; }
    .ws-comment-quote { font-size: 11px; color: #9ca3af; font-style: italic; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ws-comment-body { font-size: 13px; color: #1a1a1a; line-height: 1.4; margin-bottom: 6px; }
    .ws-comment-meta { font-size: 11px; display: flex; align-items: center; justify-content: space-between; }
    .ws-author { padding: 1px 6px; border-radius: 99px; font-weight: 700; font-size: 10px; }

    /* Details pane scroll */
    #pane-details { overflow-y: auto; padding: 40px 48px; flex-direction: column; max-width: 600px; }
    .detail-section { margin-bottom: 32px; padding-bottom: 32px; border-bottom: 1px solid #f0f1f3; }
    .detail-section:last-child { border-bottom: none; }

    /* Article editor styles */
    .section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #9ca3af; margin: 20px 0 8px;
    }
    .art-divider { border: none; border-top: 1px solid #f0f1f3; margin: 20px 0; }

    [contenteditable="true"] {
      outline: none; border-radius: 4px; transition: background 0.15s;
    }
    [contenteditable="true"]:hover { background: rgba(0,0,0,0.02); }
    [contenteditable="true"]:focus { background: rgba(0,181,163,0.04); box-shadow: 0 0 0 2px rgba(0,181,163,0.15); }

    .art-subheadline { font-size: 15px; color: #6b7280; line-height: 1.5; margin-bottom: 16px; }
    .art-body { font-size: 15px; line-height: 1.75; color: #374151; }
    .art-body p { margin-bottom: 12px; }
    .art-pull-quote {
      border-left: 3px solid #00B5A3; padding: 10px 16px; margin: 16px 0;
      font-size: 15px; font-style: italic; color: #1a1a1a;
      background: rgba(0,181,163,0.04); border-radius: 0 8px 8px 0;
    }
    .cast-name { font-weight: 700; font-size: 14px; margin-bottom: 3px; }
    .cast-bio { font-size: 14px; color: #6b7280; line-height: 1.6; margin-bottom: 14px; }
    .listicle-entry { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #f0f1f3; }
    .listicle-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .listicle-blurb { font-size: 13px; color: #6b7280; line-height: 1.6; }

    .section-block { position: relative; }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin: 20px 0 8px;
    }
    .section-header .section-label { margin: 0; }
    .copy-btn {
      opacity: 0;
      padding: 3px 9px; border-radius: 6px; border: 1px solid #e2e4e8;
      background: #fff; color: #9ca3af; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: inherit; flex-shrink: 0;
      transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
      display: inline-flex; align-items: center; white-space: nowrap;
    }
    .section-block:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: #f9fafb; border-color: #c8cdd5; color: #374151; }
    .copy-btn.copied { opacity: 1; background: rgba(0,181,163,0.08); color: #00B5A3; border-color: rgba(0,181,163,0.3); }

    /* Feedback tab */
    .feedback-empty { padding: 40px 0; text-align: center; color: #c0c4cb; font-size: 13px; }
    .feedback-card {
      border: 1px solid #f0f1f3; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
      transition: border-color 0.15s;
    }
    .feedback-card.unresolved { border-left: 3px solid #ef4444; }
    .feedback-card.resolved { opacity: 0.5; border-left: 3px solid #d1d5db; }
    .feedback-quote { font-size: 12px; color: #9ca3af; font-style: italic; margin-bottom: 6px; line-height: 1.4; }
    .feedback-body { font-size: 14px; color: #1a1a1a; line-height: 1.5; margin-bottom: 8px; }
    .feedback-meta { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #9ca3af; }
    .feedback-author { font-weight: 700; padding: 2px 7px; border-radius: 99px; font-size: 11px; }
    .from-legal { background: rgba(245,158,11,0.1); color: #d97706; }
    .from-marketing { background: rgba(99,102,241,0.1); color: #6366f1; }
    .mark-done-btn { font-size: 11px; font-weight: 700; color: #00B5A3; background: none; border: none; cursor: pointer; font-family: inherit; }

    /* Details tab */
    .detail-section-heading {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: #9ca3af; margin-bottom: 20px;
    }
    .detail-field { margin-bottom: 16px; }
    .detail-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .detail-input {
      width: 100%; padding: 9px 12px; border: 1px solid #e2e4e8; border-radius: 8px;
      font-size: 13px; font-family: inherit; color: #1a1a1a; outline: none;
      transition: border-color 0.15s;
    }
    .detail-input:focus { border-color: #00B5A3; }

    .score-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .score-label { font-size: 12px; font-weight: 600; color: #6b7280; width: 120px; flex-shrink: 0; }
    .score-bar-wrap { flex: 1; height: 6px; background: #f0f1f3; border-radius: 99px; overflow: hidden; }
    .score-bar { height: 100%; border-radius: 99px; background: #00B5A3; }
    .score-bar.low { background: #f59e0b; }
    .score-val { font-size: 12px; font-weight: 700; color: #1a1a1a; width: 36px; text-align: right; }

    .seo-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
    .seo-table th { text-align: left; font-weight: 700; color: #9ca3af; font-size: 11px; padding: 4px 8px 6px 0; border-bottom: 1px solid #f0f1f3; }
    .seo-table td { padding: 6px 8px 6px 0; color: #374151; border-bottom: 1px solid #f9fafb; }

    /* Loading / error */
    .loading { padding: 60px 32px; text-align: center; color: #c0c4cb; font-size: 14px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
      opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #00B5A3; }
    .toast.error { background: #ef4444; }

    /* Editor flag popup */
    .editor-flag-popup {
      position: fixed; background: #fff; border: 1px solid #e2e4e8;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12);
      padding: 14px; z-index: 9999; width: 280px; display: none;
    }
    .editor-flag-popup .fp-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: #9ca3af; margin-bottom: 6px;
    }
    .editor-flag-popup .fp-quote {
      font-size: 11px; color: #9ca3af; font-style: italic;
      border-left: 2px solid #00B5A3; padding-left: 8px;
      margin-bottom: 8px; line-height: 1.4;
    }
    .editor-flag-popup textarea {
      width: 100%; height: 72px; padding: 7px 9px;
      border: 1px solid #e2e4e8; border-radius: 7px;
      font-size: 13px; font-family: inherit; resize: none; outline: none;
      color: #1a1a1a; line-height: 1.4;
    }
    .editor-flag-popup textarea:focus { border-color: #00B5A3; }
    .editor-flag-popup .fp-actions { display: flex; gap: 7px; margin-top: 8px; }
    .editor-flag-popup .fp-submit {
      flex: 1; padding: 7px; border-radius: 7px; border: none;
      background: #00B5A3; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .editor-flag-popup .fp-cancel {
      padding: 7px 12px; border-radius: 7px; border: 1px solid #e2e4e8;
      background: #fff; color: #6b7280; font-size: 13px; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>

<!-- Main -->
<div class="main" id="main">
  <div class="loading" id="loading">Loading article...</div>
</div>

<div class="editor-flag-popup" id="editor-flag-popup">
  <div class="fp-label">Add note</div>
  <div class="fp-quote" id="fp-quote"></div>
  <textarea id="fp-comment" placeholder="Note or comment..."></textarea>
  <div class="fp-actions">
    <button class="fp-submit" id="fp-submit">Add note</button>
    <button class="fp-cancel" id="fp-cancel">Cancel</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '';
  const slug = new URLSearchParams(window.location.search).get('slug');
  let article = null;

  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(function() { t.className = 'toast'; }, 2800);
  }

  function statusBadge(status) {
    const map = { draft:['s-draft','Draft'], ready:['s-ready','Ready to publish'], published:['s-approved','Published'], unpublished:['s-unpublished','Unpublished'] };
    const [cls, label] = map[status] || ['s-draft', status];
    return '<span class="status-badge ' + cls + '">' + label + '</span>';
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function renderWorkspace(output, type) {
    if (!output) return '<p style="color:#9ca3af;">No content</p>';
    if (output.entries) return renderListicle(output);
    return renderSingle(output);
  }

  function singleBlock(text, cls) {
    let paras = (text || '').split(/\n\n+/).map(function(p) { return p.trim(); }).filter(Boolean);
    return '<div class="art-body ' + cls + '" contenteditable="true">' + paras.map(esc).join('<br><br>') + '</div>';
  }

  function renderSingle(o) {
    let html = '<div class="section-block">';
    html += '<div class="section-header"><span class="section-label">Subheadline</span><button class="copy-btn" data-copy=".subheadline">Copy</button></div>';
    html += '<div class="art-subheadline subheadline" contenteditable="true">' + esc(o.subheadline) + '</div>';
    html += '</div>';

    html += '<hr class="art-divider">';

      html += '<div class="section-block">';
      html += '<div class="section-header"><span class="section-label">Pull quote</span><button class="copy-btn" data-copy=".art-pull-quote">Copy</button></div>';
      html += '<div class="art-pull-quote" contenteditable="true">' + esc(o.pullQuote) + '</div>';

    }

    if (o.cast && o.cast.length) {

        html += '<div class="section-block">';
        html += '<div class="section-header" style="margin-top:4px;"><span style="font-size:13px;font-weight:600;color:#374151;">' + esc(c.name) + '</span><button class="copy-btn" data-copy=".cast-bio-' + i + '">Copy bio</button></div>';
        html += '<div class="cast-name" contenteditable="true">' + esc(c.name) + '</div>';
        html += '<div class="cast-bio cast-bio-' + i + '" contenteditable="true">' + esc(c.bio) + '</div>';
        html += '</div>';
      });
    }

    if (o.whyWatchIt) {
      html += '<hr class="art-divider">';
      html += '<div class="section-block">';
      html += '<div class="section-header"><span class="section-label">Why watch it</span><button class="copy-btn" data-copy=".why-watch-it">Copy</button></div>';

        html += '<p><strong>Cast:</strong> <span contenteditable="true">' + esc(o.moreDetails.fullCast.join(', ')) + '</span></p>';
      }
      html += '</div>';

    return html;
  }

  function renderListicle(o) {
    let sub = o.subtitle || o.subheadline || o.angle || '';
    let intro = o.intro || o.introduction || '';

    let html = '<div class="section-block">';
    html += '<div class="section-header"><span class="section-label">Subheadline</span><button class="copy-btn" data-copy=".listicle-sub">Copy</button></div>';
    html += '<div class="art-subheadline listicle-sub" contenteditable="true">' + esc(sub) + '</div>';
    html += '</div>';

    html += '<hr class="art-divider">';

    html += '<div class="section-block">';
    html += '<div class="section-header"><span class="section-label">Intro</span><button class="copy-btn" data-copy=".listicle-intro">Copy</button></div>';
    html += singleBlock(intro, 'listicle-intro');
    html += '</div>';

    html += '<hr class="art-divider">';

    (o.entries || []).forEach(function(e, i) {
      var tease = e.tease ? ' — ' + e.tease : '';

  function renderWsComments(comments) {
    if (!comments.length) return '<div style="padding:20px;text-align:center;color:#c0c4cb;font-size:12px;">No feedback yet</div>';
    return comments.map(function(c) {
      var resolved = !!c.resolvedAt;
      var reply = c.reply || '';
      var authorStyle = c.author === 'Legal'
        ? 'background:rgba(245,158,11,0.1);color:#d97706;'
        : c.author === 'Marketing'
        ? 'background:rgba(99,102,241,0.1);color:#6366f1;'
        : 'background:rgba(0,181,163,0.1);color:#00B5A3;';
      var borderColor = c.author === 'Legal' ? '#d97706' : c.author === 'Marketing' ? '#6366f1' : '#00B5A3';
      return '<div class="ws-comment-card" data-comment-id="' + c.id + '" style="border:1px solid #f0f1f3;border-left:3px solid ' + borderColor + ';border-radius:8px;padding:10px 12px;margin-bottom:8px;' + (resolved ? 'opacity:0.45;' : '') + '">'
        + '<div style="font-size:11px;color:#9ca3af;font-style:italic;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">"' + esc((c.selectedText || '').slice(0, 55)) + (c.selectedText && c.selectedText.length > 55 ? '…' : '') + '"</div>'
        + '<div style="font-size:13px;color:#1a1a1a;line-height:1.4;margin-bottom:8px;">' + esc(c.comment) + '</div>'
        // Reply (if exists)
        + (reply ? '<div style="background:#f9fafb;border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:12px;color:#374151;line-height:1.4;"><span style="font-weight:700;color:#00B5A3;font-size:10px;display:block;margin-bottom:3px;">EDITOR REPLY</span>' + esc(reply) + '</div>' : '')
        // Reply input (hidden by default)
        + '<div class="reply-area" id="reply-area-' + c.id + '" style="display:none;margin-bottom:8px;">'
        + '<textarea class="reply-input" id="reply-input-' + c.id + '" placeholder="Type your reply..." style="width:100%;height:60px;padding:6px 8px;border:1px solid #e2e4e8;border-radius:6px;font-size:12px;font-family:inherit;outline:none;resize:none;color:#1a1a1a;line-height:1.4;"></textarea>'
        + '<div style="display:flex;gap:6px;margin-top:5px;">'
        + '<button class="send-reply-btn" data-id="' + c.id + '" style="flex:1;padding:5px;border-radius:6px;border:none;background:#1a1a1a;color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Send reply</button>'
        + '<button class="cancel-reply-btn" data-id="' + c.id + '" style="padding:5px 10px;border-radius:6px;border:1px solid #e2e4e8;background:#fff;color:#6b7280;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Cancel</button>'
        + '</div></div>'
        // Footer row
        + '<div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;">'
        + '<span style="padding:1px 6px;border-radius:99px;font-weight:700;font-size:10px;' + authorStyle + '">' + esc(c.author) + '</span>'
        + '<div style="display:flex;gap:8px;align-items:center;">'
        + (!reply ? '<button class="toggle-reply-btn" data-id="' + c.id + '" style="font-size:11px;font-weight:600;color:#6b7280;background:none;border:none;cursor:pointer;font-family:inherit;">Reply</button>' : '<button class="toggle-reply-btn" data-id="' + c.id + '" style="font-size:11px;font-weight:600;color:#6b7280;background:none;border:none;cursor:pointer;font-family:inherit;">Edit reply</button>')
        + (resolved ? '<span style="color:#00B5A3;font-size:10px;font-weight:700;">✓ Done</span>' : '<button class="mark-done-btn" data-id="' + c.id + '" style="font-size:11px;font-weight:700;color:#00B5A3;background:none;border:none;cursor:pointer;font-family:inherit;">Mark done</button>')
        + '</div></div></div>';
    }).join('');
  }

  function applyEditorHighlights(containerEl, comments) {
    for (var i = 0; i < (comments || []).length; i++) {
      let c = comments[i];
      if (c.resolvedAt || !c.selectedText) continue;
      var color = c.author === 'Legal' ? 'rgba(245,158,11,0.3)' : c.author === 'Marketing' ? 'rgba(99,102,241,0.2)' : 'rgba(0,181,163,0.25)';
      var walker = document.createTreeWalker(containerEl, NodeFilter.SHOW_TEXT);
      var node;
      while (node = walker.nextNode()) {
        var idx = node.textContent.indexOf(c.selectedText);
        if (idx === -1) continue;
        var range = document.createRange();
        range.setStart(node, idx); range.setEnd(node, idx + c.selectedText.length);
        var mark = document.createElement('mark');
        mark.dataset.commentId = c.id;
        mark.style.cssText = 'background:' + color + ';border-radius:2px;cursor:pointer;';
        try { range.surroundContents(mark); } catch {}
        break;
      }
    }
    containerEl.querySelectorAll('mark[data-comment-id]').forEach(function(m) {
      m.addEventListener('click', function() {
        let id = m.dataset.commentId;
        document.querySelectorAll('.ws-comment-card').forEach(function(c) { c.style.outline = ''; });
        var card = document.querySelector('.ws-comment-card[data-comment-id="' + id + '"]');
        if (card) { card.style.outline = '2px solid ' + (m.style.background.includes('245') ? '#d97706' : '#6366f1'); card.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
      });
    });
  }

  function renderFeedback(comments) {
    if (!comments.length) return '<div class="feedback-empty">No reviewer feedback yet.<br>Send the article to Legal or Marketing review to receive comments.</div>';
    return comments.map(function(c) {
      var resolved = !!c.resolvedAt;
      var authorCls = c.author === 'Legal' ? 'from-legal' : 'from-marketing';
      return '<div class="feedback-card ' + (resolved ? 'resolved' : 'unresolved') + '" data-comment-id="' + c.id + '">'
        + '<div class="feedback-quote">"' + esc((c.selectedText || '').slice(0, 100)) + (c.selectedText && c.selectedText.length > 100 ? '…' : '') + '"</div>'
        + '<div class="feedback-body">' + esc(c.comment) + '</div>'
        + '<div class="feedback-meta">'
        + '<span class="feedback-author ' + authorCls + '">' + esc(c.author) + '</span>'
        + (resolved
          ? '<span style="color:#00B5A3;font-size:11px;font-weight:600;">✓ Addressed</span>'
          : '<button class="mark-done-btn" data-id="' + c.id + '">Mark as addressed</button>')
        + '</div></div>';
    }).join('');
  }

  function renderDetails(a) {
    let seo = a.seo || {};
    let html = '';

    // --- Publishing ---
    let pubLine = a.published
      ? '<span style="color:#16a34a;font-weight:700;font-size:14px;">● Live</span>'
        + (a.publishedAt ? '<span style="color:#9ca3af;font-size:13px;margin-left:10px;">Published ' + formatDate(a.publishedAt) + '</span>' : '')
      : '<span style="color:#9ca3af;font-size:14px;">Not published</span>';

    html += '<div class="detail-section">'
      + '<div class="detail-section-heading">Publishing</div>'
      + '<div style="margin-bottom:20px;">' + pubLine + '</div>'
      + '<div class="detail-field">'
      + '<div class="detail-label">Schedule publish</div>'
      + '<input class="detail-input" id="publish-at" type="datetime-local" value="' + esc(a.publishAt ? a.publishAt.slice(0,16) : '') + '">'
      + '<div style="font-size:12px;color:#9ca3af;margin-top:6px;">Leave blank to publish immediately when you click Publish.</div>'
      + '</div>'
      + '<div class="detail-field">'
      + '<div class="detail-label">Out of window date</div>'
      + '<input class="detail-input" id="out-of-window" type="date" value="' + esc(a.outOfWindowDate ? a.outOfWindowDate.slice(0,10) : '') + '">'
      + '<div style="font-size:12px;color:#9ca3af;margin-top:6px;">Date this article should be unpublished or archived.</div>'
      + '</div>'
      + '</div>';

    // --- SEO ---
    html += '<div class="detail-section">'
      + '<div class="detail-section-heading">SEO</div>'
      + '<div class="detail-field">'
      + '<div class="detail-label">Meta title</div>'
      + '<input class="detail-input" id="seo-title" type="text" value="' + esc(seo.metaTitle || '') + '" placeholder="Leave blank to use article headline">'
      + '</div>'
      + '<div class="detail-field">'
      + '<div class="detail-label">Meta description</div>'
      + '<textarea class="detail-input" id="seo-description" rows="3" placeholder="150–160 characters recommended" style="resize:vertical;">' + esc(seo.metaDescription || '') + '</textarea>'
      + '</div>'
      + '<div class="detail-field">'
      + '<div class="detail-label">Canonical URL</div>'
      + '<input class="detail-input" id="seo-canonical" type="text" value="' + esc(seo.canonicalUrl || '') + '" placeholder="https://tubi.tv/editorial/...">'
      + '</div>'
      + '</div>';

    // --- Content ---
    html += '<div class="detail-section">'
      + '<div class="detail-section-heading">Content</div>'
      + '<div class="detail-field">'
      + '<div class="detail-label">Hero image URL</div>'
      + '<input class="detail-input" id="hero-url" type="text" value="' + esc(a.heroImageUrl || '') + '" placeholder="https://...">'
      + '</div>'
      + '<div class="detail-field">'
      + '<div class="detail-label">Tags</div>'
      + '<input class="detail-input" id="tags-input" type="text" value="' + esc((a.tags || []).join(', ')) + '" placeholder="horror, comedy...">'
      + '</div>'
      + '</div>';

    // --- Brand score ---
    if (a.brandScore != null) {
      let pct = (a.brandScore / 5) * 100;
      let barCls = a.brandScore >= 3.5 ? '' : 'low';
      html += '<div class="detail-section">'
        + '<div class="detail-section-heading">Brand score</div>'
        + '<div class="score-row">'
        + '<span class="score-label">Brand alignment</span>'
        + '<div class="score-bar-wrap"><div class="score-bar ' + barCls + '" style="width:' + pct + '%"></div></div>'
        + '<span class="score-val">' + a.brandScore.toFixed(1) + '/5</span>'
        + '</div>'
        + (a.brandNotes ? '<div style="font-size:12px;color:#6b7280;margin-top:10px;line-height:1.5;">' + esc(a.brandNotes) + '</div>' : '')
        + '</div>';
    }

    // --- GSC ---
    html += '<div class="detail-section">'
      + '<div class="detail-section-heading">Top search queries (GSC)</div>';
    if (a.gscQueries && a.gscQueries.length) {
      html += '<table class="seo-table"><thead><tr><th>Query</th><th>Impressions</th><th>Clicks</th><th>Position</th></tr></thead><tbody>'
        + a.gscQueries.map(function(q) {
          return '<tr><td>' + esc(q.query) + '</td><td>' + q.impressions.toLocaleString() + '</td><td>' + q.clicks + '</td><td>' + q.position.toFixed(1) + '</td></tr>';
        }).join('')
        + '</tbody></table>';
    } else {
      html += '<div style="font-size:13px;color:#9ca3af;">No search data yet. GSC data will appear here after the article is published and indexed.</div>';
    }
    html += '</div>';

    return html;
  }

  function buildPage(a) {
    article = a;
    let output = a.output || {};
    let headline = output.headline || a.articleTitle || 'Untitled';
    let tags = (a.tags || []).map(function(t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');

    let mainEl = document.getElementById('main');
    mainEl.innerHTML = [
      // Top bar
      '<div class="topbar">',
        '<a href="/generate?tab=articles" class="back-link">&#8592; Articles</a>',
        '<div class="topbar-actions">',
          '<button class="btn-export" id="btn-export" title="Download dev-ready ZIP (JSON + images)">',
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-8m0 8l-3-3m3 3l3-3M4 20h16"/></svg>',
            'Export ZIP',
          '</button>',
          '<button class="btn-save" id="btn-save">Save changes</button>',
          '<button class="btn-publish ' + (a.published ? 'published' : '') + '" id="btn-publish">' + (a.published ? 'Unpublish' : 'Publish') + '</button>',
        '</div>',
      '</div>',
      // Article header
      '<div class="article-header">',
        '<div class="article-headline-edit" contenteditable="true" id="headline-edit" data-placeholder="Article headline">' + esc(headline) + '</div>',
        '<div class="meta-bar">',
          '<div class="meta-item"><span class="meta-label">Status</span>&nbsp;<div class="status-dropdown" id="status-dropdown"><span id="status-badge">' + statusBadge(a.status) + '</span><div class="status-dropdown-menu" id="status-menu"><div class="status-dropdown-item" data-status="draft"><span class="status-badge s-draft">Draft</span></div><div class="status-dropdown-item" data-status="ready"><span class="status-badge s-ready">Ready to publish</span></div><div class="status-dropdown-item" data-status="approved"><span class="status-badge s-approved">Published</span></div><div class="status-dropdown-item" data-status="unpublished"><span class="status-badge s-unpublished">Unpublished</span></div></div></div></div>',
          '<div class="meta-div"></div>',
          '<div class="meta-item"><span class="meta-label">Content ID</span>&nbsp;' + esc(a.contentId || '—') + '</div>',
          '<div class="meta-div"></div>',
          '<div class="meta-item"><span class="meta-label">Type</span>&nbsp;' + (a.articleType === 'listicle' ? 'Listicle' : 'Single Title') + '</div>',
          a.brandScore != null ? '<div class="meta-div"></div><div class="meta-item"><span class="meta-label">Brand score</span>&nbsp;' + a.brandScore.toFixed(1) + '/5</div>' : '',
          '<div class="meta-div"></div>',
          '<div class="meta-item"><span class="meta-label">Saved</span>&nbsp;' + formatDate(a.createdAt) + '</div>',
        '</div>',
        tags ? '<div class="tag-row">' + tags + '</div>' : '',
      '</div>',
      // Tabs
      '<div class="tabs-row">',
        '<div class="tab-bar">',
          '<button class="tab active" data-tab="workspace">Workspace</button>',
          '<button class="tab" data-tab="details">Details</button>',
        '</div>',
      '</div>',
      // Workspace pane (split: article | comments)
      '<div class="tab-pane active" id="pane-workspace">',
        '<div class="ws-article" id="ws-article-content">',
          renderWorkspace(output, a.articleType),
        '</div>',
        '<div class="ws-comments ' + ((a.comments && a.comments.length > 0) ? '' : 'empty') + '" id="ws-comments-panel">',
          '<div class="ws-comments-header">Reviewer feedback <span id="ws-count" style="background:rgba(239,68,68,0.1);color:#ef4444;padding:2px 6px;border-radius:99px;font-size:10px;font-weight:700;">' + ((a.comments || []).filter(c => !c.resolvedAt).length) + '</span></div>',
          '<div class="ws-comments-list" id="ws-comments-list">',
            renderWsComments(a.comments || []),
          '</div>',
        '</div>',
      '</div>',
      // Details pane
      '<div class="tab-pane" id="pane-details">',
        renderDetails(a),
      '</div>',
    ].join('');

    // Apply highlights to workspace article
    setTimeout(function() {
      let wsArticle = document.getElementById('ws-article-content');
      if (wsArticle) applyEditorHighlights(wsArticle, a.comments || []);
    }, 0);

    // Tab switching
    mainEl.querySelectorAll('.tab').forEach(function(btn) {
      btn.addEventListener('click', function() {
        mainEl.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        let tab = btn.dataset.tab;
        document.getElementById('pane-workspace').classList.toggle('active', tab === 'workspace');
        document.getElementById('pane-details').classList.toggle('active', tab === 'details');
      });
    });

    // Copy section button
    mainEl.addEventListener('click', function(e) {
      let btn = e.target.closest('.copy-btn');
      if (!btn) return;
      var sel = btn.dataset.copy;
      var block = btn.closest('.section-block');
      if (!block || !sel) return;
      var target = block.querySelector(sel);
      if (!target) return;
      let text = (target.innerText || target.textContent || '').trim();
      if (!text) return;
      navigator.clipboard.writeText(text).then(function() {
        let orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('copied');
        setTimeout(function() { btn.textContent = orig; btn.classList.remove('copied'); }, 1800);
      }).catch(function() { showToast('Could not copy', 'error'); });
    });

    // Toggle reply area
    mainEl.addEventListener('click', function(e) {
      let btn = e.target.closest('.toggle-reply-btn');
      if (!btn) return;
      let id = btn.dataset.id;
      let area = document.getElementById('reply-area-' + id);
      if (!area) return;
      let isVisible = area.style.display !== 'none';
      area.style.display = isVisible ? 'none' : 'block';
      if (!isVisible) document.getElementById('reply-input-' + id).focus();
    });

    // Cancel reply
    mainEl.addEventListener('click', function(e) {
      let btn = e.target.closest('.cancel-reply-btn');
      if (!btn) return;
      let area = document.getElementById('reply-area-' + btn.dataset.id);
      if (area) area.style.display = 'none';
    });

    // Send reply
    mainEl.addEventListener('click', async function(e) {
      let btn = e.target.closest('.send-reply-btn');
      if (!btn) return;
      let id = btn.dataset.id;
      let input = document.getElementById('reply-input-' + id);
      let replyText = input ? input.value.trim() : '';
      if (!replyText) return;
      btn.disabled = true; btn.textContent = 'Sending...';
      try {
        let resp = await fetch(API + '/api/articles/' + slug + '/comments/' + id, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ reply: replyText }),
        });
        if (!resp.ok) throw new Error();
        let data = await resp.json();
        let c = (article.comments || []).find(function(c) { return c.id === id; });
        if (c) c.reply = replyText;
        let wsList = document.getElementById('ws-comments-list');
        if (wsList) wsList.innerHTML = renderWsComments(article.comments || []);
        showToast('Reply sent', 'success');
      } catch { showToast('Failed to send reply', 'error'); btn.disabled = false; btn.textContent = 'Send reply'; }
    });

    // Mark feedback as addressed
    mainEl.addEventListener('click', async function(e) {
      let btn = e.target.closest('.mark-done-btn');
      if (!btn) return;
      let id = btn.dataset.id;
      try {
        let resp = await fetch(API + '/api/articles/' + slug + '/comments/' + id, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ resolved: true, resolvedBy: 'Editor' }),
        });
        let data = await resp.json();
        let c = (article.comments || []).find(function(c) { return c.id === id; });
        if (c) { c.resolvedAt = data.comment.resolvedAt; c.resolvedBy = data.comment.resolvedBy; }
        let wsList = document.getElementById('ws-comments-list');
        if (wsList) wsList.innerHTML = renderWsComments(article.comments || []);
        // Re-apply highlights
        let wsArticle = document.getElementById('ws-article-content');
        if (wsArticle) { wsArticle.querySelectorAll('mark').forEach(function(m) { var p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); }); applyEditorHighlights(wsArticle, article.comments || []); }
        let cnt = (article.comments || []).filter(function(c) { return !c.resolvedAt; }).length;
        let badge = document.getElementById('ws-count');
        if (badge) badge.textContent = cnt;
        showToast('Marked as addressed', 'success');
      } catch { showToast('Failed', 'error'); }
    });

    // Export JSON
    document.getElementById('btn-export').addEventListener('click', async function() {
      let btn = document.getElementById('btn-export');
      btn.disabled = true; btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-8m0 8l-3-3m3 3l3-3M4 20h16"/></svg> Exporting…';
      try {
        let resp = await fetch(API + '/api/export/' + slug);
        if (!resp.ok) { var err = await resp.json(); throw new Error(err.error || 'Export failed'); }
        let blob = await resp.blob();
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url; a.download = slug + '.zip'; a.click();
        URL.revokeObjectURL(url);
        showToast('Exported ' + slug + '.zip', 'success');
      } catch (e) { showToast(e.message || 'Export failed', 'error'); }
      btn.disabled = false; btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16v-8m0 8l-3-3m3 3l3-3M4 20h16"/></svg> Export ZIP';
    });

    // Save
    document.getElementById('btn-save').addEventListener('click', saveArticle);

    // Status dropdown
    document.getElementById('status-badge').addEventListener('click', function(e) {
      e.stopPropagation();
      document.getElementById('status-menu').classList.toggle('open');
    });
    document.getElementById('status-menu').addEventListener('click', async function(e) {
      let item = e.target.closest('[data-status]');
      if (!item) return;
      var newStatus = item.dataset.status;
      document.getElementById('status-menu').classList.remove('open');
      if (newStatus === article.status) return;
      try {
        let resp = await fetch(API + '/api/articles/' + slug, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus }),
        });
        if (!resp.ok) throw new Error();
        article.status = newStatus;
        document.getElementById('status-badge').innerHTML = statusBadge(newStatus);
        showToast('Status updated', 'success');
      } catch { showToast('Failed to update status', 'error'); }
    });
    document.addEventListener('click', function() {
      var menu = document.getElementById('status-menu');
      if (menu) menu.classList.remove('open');
    });

    // Publish / Unpublish
    document.getElementById('btn-publish').addEventListener('click', async function() {
      let btn = document.getElementById('btn-publish');
      var isPublished = article.published;
      var action = isPublished ? 'unpublish' : 'publish';
      if (isPublished && !confirm('Unpublish this article? It will be removed from the live feed immediately.')) return;
      btn.disabled = true;
      btn.textContent = isPublished ? 'Unpublishing...' : 'Publishing...';
      try {
        let resp = await fetch(API + '/api/articles/' + slug + '/publish', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ publish: !isPublished }),
        });
        if (!resp.ok) throw new Error();
        let data = await resp.json();
        article.published = data.article.published;
        article.publishedAt = data.article.publishedAt;
        article.status = data.article.status;
        btn.textContent = article.published ? 'Unpublish' : 'Publish';
        btn.className = 'btn-publish' + (article.published ? ' published' : '');
        document.getElementById('status-badge').innerHTML = statusBadge(article.status);
        // Refresh publish status line in details pane if open
        var pubAtEl = document.getElementById('publish-at');
        if (pubAtEl) {
          let pubLine = article.published
            ? '<span style="color:#16a34a;font-weight:700;font-size:13px;">● Live</span>'
              + (article.publishedAt ? '<span style="color:#9ca3af;font-size:12px;margin-left:8px;">Published ' + formatDate(article.publishedAt) + '</span>' : '')
            : '<span style="color:#9ca3af;font-size:13px;">Not published</span>';
          pubAtEl.previousElementSibling && (pubAtEl.previousElementSibling.innerHTML = pubLine);
        }
        showToast(article.published ? 'Published' : 'Unpublished', 'success');
      } catch {
        showToast('Failed', 'error');
      }
      btn.disabled = false;
    });
  }

  function collectOutput() {
    let o = JSON.parse(JSON.stringify(article.output || {}));
    var ws = document.getElementById('pane-workspace');
    if (!ws) return o;

    function read(sel) {
      var el = ws.querySelector(sel);
      return el ? el.innerText.trim() : null;
    }

    // Headline
    let hl = document.getElementById('headline-edit');
    if (hl) o.headline = hl.textContent.trim();

    if (o.entries) {
      // Listicle
      let sub = read('.listicle-sub'); if (sub !== null) { o.subtitle = sub; o.subheadline = sub; o.angle = sub; }
      let intro = read('.listicle-intro'); if (intro !== null) { o.intro = intro; o.introduction = intro; }
      let closing = read('.listicle-closing'); if (closing !== null) o.closing = closing;
      let titles = ws.querySelectorAll('.listicle-title');
      let blurbs = ws.querySelectorAll('.listicle-blurb');
      titles.forEach(function(el, i) {
        if (o.entries[i]) {
          let raw = el.textContent.replace(/^\d+\.\s*/, '');
          let dashIdx = raw.indexOf(' — ');
          o.entries[i].title = (dashIdx !== -1 ? raw.slice(0, dashIdx) : raw).trim();
        }
      });
      blurbs.forEach(function(el, i) {
        if (o.entries[i]) o.entries[i].blurb = el.innerText.trim();
      });
    } else {
      // Single
      let sub = read('.subheadline'); if (sub !== null) o.subheadline = sub;
      let intro = read('.introduction'); if (intro !== null) o.introduction = intro;
      let why = read('.why-watch-it'); if (why !== null) o.whyWatchIt = why;
      let pq = ws.querySelector('.art-pull-quote'); if (pq) o.pullQuote = pq.textContent.trim();
      let castNames = ws.querySelectorAll('.cast-name');
      let castBios = ws.querySelectorAll('.cast-bio');
      if (castNames.length && o.cast) {
        castNames.forEach(function(el, i) { if (o.cast[i]) o.cast[i].name = el.textContent.trim(); });
        castBios.forEach(function(el, i) { if (o.cast[i]) o.cast[i].bio = el.innerText.trim(); });
      }
    }
    return o;
  }

  async function saveArticle() {
    let btn = document.getElementById('btn-save');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    let heroUrl = document.getElementById('hero-url') ? document.getElementById('hero-url').value : article.heroImageUrl;
    let tagsRaw = document.getElementById('tags-input') ? document.getElementById('tags-input').value : (article.tags || []).join(', ');
    let tags = tagsRaw.split(',').map(function(t) { return t.trim(); }).filter(Boolean);
    let seo = {
      metaTitle: (document.getElementById('seo-title') ? document.getElementById('seo-title').value : article.seo && article.seo.metaTitle) || '',
      metaDescription: (document.getElementById('seo-description') ? document.getElementById('seo-description').value : article.seo && article.seo.metaDescription) || '',
      canonicalUrl: (document.getElementById('seo-canonical') ? document.getElementById('seo-canonical').value : article.seo && article.seo.canonicalUrl) || '',
    };
    let publishAtEl = document.getElementById('publish-at');
    let publishAt = publishAtEl && publishAtEl.value ? new Date(publishAtEl.value).toISOString() : null;
    let outOfWindowEl = document.getElementById('out-of-window');
    let outOfWindowDate = outOfWindowEl && outOfWindowEl.value ? outOfWindowEl.value : null;
    try {
      let resp = await fetch(API + '/api/articles/' + slug, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ output: collectOutput(), heroImageUrl: heroUrl, tags: tags, seo: seo, publishAt: publishAt, outOfWindowDate: outOfWindowDate }),
      });
      if (!resp.ok) throw new Error('Save failed');
      article.seo = seo;
      article.publishAt = publishAt;
      article.outOfWindowDate = outOfWindowDate;
      showToast('Saved', 'success');
    } catch (e) {
      showToast('Save failed', 'error');
    }
    btn.disabled = false;
    btn.textContent = 'Save changes';
  }


  async function loadArticle() {
    if (!slug) {
      document.getElementById('main').innerHTML = '<div class="loading">No article slug provided. <a href="/generate?tab=articles">← Back to articles</a></div>';
      return;
    }
    try {
      let resp = await fetch(API + '/api/articles/' + slug);
      if (!resp.ok) throw new Error('Not found');
      let data = await resp.json();
      buildPage(data);
    } catch (e) {
      document.getElementById('main').innerHTML = '<div class="loading">Could not load article. <a href="/generate?tab=articles">← Back to articles</a></div>';
    }
  }

  loadArticle();

  // --- Editor text selection → comment ---

  var editorPendingSelection = null;

  document.addEventListener('mouseup', function(e) {
    // Only trigger inside the workspace article area
    let wsArticle = document.getElementById('ws-article-content');
    if (!wsArticle || !wsArticle.contains(e.target)) return;
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    let text = sel.toString().trim();
    if (text.length < 3) return;

    var range = sel.getRangeAt(0);
    var preOffset = range.startOffset;
    var preNode = range.startContainer;
    var textBefore = preNode.textContent
      ? preNode.textContent.slice(Math.max(0, preOffset - 40), preOffset) : '';
    editorPendingSelection = { text: text, textBefore: textBefore };

    var rect = range.getBoundingClientRect();
    var popup = document.getElementById('editor-flag-popup');
    document.getElementById('fp-quote').textContent = '"' + text.slice(0, 55) + (text.length > 55 ? '…' : '') + '"';
    document.getElementById('fp-comment').value = '';
    popup.style.top = (rect.bottom + window.scrollY + 8) + 'px';
    popup.style.left = Math.max(8, rect.left + window.scrollX) + 'px';
    popup.style.display = 'block';
    document.getElementById('fp-comment').focus();
  });

  document.getElementById('fp-submit').addEventListener('click', async function() {
    var comment = document.getElementById('fp-comment').value.trim();
    if (!comment || !editorPendingSelection || !slug) return;
    let btn = document.getElementById('fp-submit');
    btn.disabled = true; btn.textContent = 'Saving...';
    try {
      let resp = await fetch(API + '/api/articles/' + slug + '/comments', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          selectedText: editorPendingSelection.text,
          textBefore: editorPendingSelection.textBefore,
          comment: comment,
          author: 'Editor',
        }),
      });
      let data = await resp.json();
      if (!article.comments) article.comments = [];
      article.comments.push(data.comment);

      // Re-render comments panel and highlights
      let wsList = document.getElementById('ws-comments-list');
      if (wsList) wsList.innerHTML = renderWsComments(article.comments);
      let wsArticle = document.getElementById('ws-article-content');
      if (wsArticle) {
        wsArticle.querySelectorAll('mark').forEach(function(m) {
          var p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m);
        });
        applyEditorHighlights(wsArticle, article.comments);
      }
      let panel = document.getElementById('ws-comments-panel');
      if (panel) panel.classList.remove('empty');
      closeEditorPopup();
      showToast('Note added', 'success');
    } catch { showToast('Failed', 'error'); }
    btn.disabled = false; btn.textContent = 'Add note';
  });

  function closeEditorPopup() {
    document.getElementById('editor-flag-popup').style.display = 'none';
    editorPendingSelection = null;
    window.getSelection()?.removeAllRanges();
  }

  document.getElementById('fp-cancel').addEventListener('click', closeEditorPopup);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeEditorPopup(); });
  document.addEventListener('mousedown', function(e) {
    var popup = document.getElementById('editor-flag-popup');
    if (popup.style.display === 'block' && !popup.contains(e.target)) closeEditorPopup();
  });
</script>
</body>
