<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git — Article Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6f8; color: #1a1a1a; min-height: 100vh; display: flex;
    }

    .dossier-sidebar {
      width: 200px; min-width: 200px; background: #1E1E2D;
      display: flex; flex-direction: column; padding: 12px;
      height: 100vh; position: sticky; top: 0; flex-shrink: 0;
    }
    .ds-logo { display: flex; align-items: center; gap: 10px; padding: 14px 12px 22px; }
    .ds-logo span { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    .ds-nav { display: flex; flex-direction: column; gap: 2px; }
    .ds-nav-item {
      display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px;
      color: rgba(255,255,255,0.5); text-decoration: none; font-size: 14px; font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .ds-nav-item:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
    .ds-nav-item.active { background: #7C3AED; color: #fff; }
    .ds-icon { width: 18px; height: 18px; flex-shrink: 0; }

    .main { flex: 1; min-width: 0; padding: 32px 36px; display: flex; flex-direction: column; gap: 20px; max-width: 800px; }

    .page-header { margin-bottom: 4px; }
    .page-title { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 3px; }
    .page-sub { font-size: 13px; color: #8b919a; }

    .card {
      background: #fff; border: 1px solid #e2e4e8; border-radius: 14px; padding: 24px;
    }
    .card-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: #9ca3af; margin-bottom: 16px;
    }

    /* Status card */
    .status-row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .branch-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(124,58,237,0.08); color: #7C3AED;
      padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700;
    }
    .ahead-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(0,181,163,0.08); color: #00B5A3;
      padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600;
    }
    .ahead-badge.none { background: #f3f4f6; color: #9ca3af; }

    .file-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; max-height: 240px; overflow-y: auto; }
    .file-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 10px; border-radius: 6px; background: #f9fafb; border: 1px solid #f0f1f3;
    }
    .file-check { width: 15px; height: 15px; cursor: pointer; flex-shrink: 0; accent-color: #7C3AED; }
    .file-status {
      font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 3px;
      flex-shrink: 0; font-family: monospace;
    }
    .fs-M { background: rgba(245,158,11,0.12); color: #d97706; }
    .fs-A { background: rgba(0,181,163,0.12); color: #00B5A3; }
    .fs-D { background: rgba(239,68,68,0.12); color: #ef4444; }
    .fs-other { background: #f3f4f6; color: #6b7280; }
    .file-path { font-size: 12px; color: #374151; font-family: monospace; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .no-changes { font-size: 13px; color: #9ca3af; padding: 8px 0; }

    .refresh-btn {
      padding: 6px 13px; border-radius: 7px; border: 1px solid #e2e4e8;
      background: #fff; font-size: 12px; font-weight: 600; color: #6b7280;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .refresh-btn:hover { border-color: #c4b5fd; color: #7C3AED; }
    .refresh-btn:disabled { opacity: 0.4; cursor: default; }

    /* Commit card */
    .msg-textarea {
      width: 100%; min-height: 72px; padding: 10px 12px;
      border: 1px solid #e2e4e8; border-radius: 8px;
      font-size: 13px; font-family: inherit; color: #1a1a1a;
      resize: vertical; outline: none; transition: border-color 0.15s;
      line-height: 1.5; margin-bottom: 14px;
    }
    .msg-textarea:focus { border-color: #7C3AED; }
    .msg-textarea::placeholder { color: #c0c4cb; }

    .select-all-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12px; color: #6b7280; }
    .select-all-row a { color: #7C3AED; cursor: pointer; font-weight: 600; text-decoration: none; }
    .select-all-row a:hover { text-decoration: underline; }

    .action-btn {
      padding: 9px 20px; border-radius: 8px; border: none;
      background: #00B5A3; color: #fff; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.15s;
      display: inline-flex; align-items: center; gap: 7px;
    }
    .action-btn:hover { background: #009e8e; }
    .action-btn:disabled { background: #d1d5db; cursor: default; }
    .action-btn.push { background: #7C3AED; }
    .action-btn.push:hover { background: #6d28d9; }
    .action-btn.push:disabled { background: #d1d5db; }

    .btn-spinner {
      width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; display: none;
    }
    .spinning .btn-spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-msg { font-size: 12px; margin-top: 10px; min-height: 18px; }
    .result-msg.ok { color: #00B5A3; }
    .result-msg.err { color: #ef4444; }

    /* Push card */
    .push-row { display: flex; align-items: center; gap: 12px; }
    .push-status-text { font-size: 13px; color: #6b7280; flex: 1; }
    .push-status-text strong { color: #1a1a1a; }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 600;
      padding: 10px 18px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
      opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 1000;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #00B5A3; }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>

<aside class="dossier-sidebar">
  <div class="ds-logo">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7C3AED" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Article Studio</span>
  </div>
  <nav class="ds-nav">
    <a href="/monitor" class="ds-nav-item">
      <svg class="ds-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/></svg>
      Monitor
    </a>
    <a href="/articles" class="ds-nav-item">
      <svg class="ds-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      Articles
    </a>
    <a href="/generate" class="ds-nav-item">
      <svg class="ds-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" d="M11 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-5m-1.414-9.414a2 2 0 1 1 2.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
      Generate
    </a>
    <a href="/pipeline" class="ds-nav-item">
      <svg class="ds-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>
      Pipeline
    </a>
    <a href="/history" class="ds-nav-item">
      <svg class="ds-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="9"/><polyline points="12,7 12,12 15,15"/></svg>
      History
    </a>
    <a href="/git" class="ds-nav-item active">
      <svg class="ds-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6M9 6h3a3 3 0 0 1 3 3v3"/></svg>
      Git
    </a>
  </nav>
</aside>

<div class="main">
  <div class="page-header">
    <div class="page-title">Git</div>
    <div class="page-sub">Commit and push changes to the blog content repo</div>
  </div>

  <!-- Repo Status -->
  <div class="card" id="status-card">
    <div class="card-title">Repo Status — V2-Blog-main</div>
    <div class="status-row">
      <div class="branch-badge" id="branch-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6M9 6h3a3 3 0 0 1 3 3v3"/></svg>
        Loading...
      </div>
      <div class="ahead-badge none" id="ahead-badge">—</div>
      <button class="refresh-btn" id="refresh-btn">Refresh</button>
    </div>
    <div class="file-list" id="file-list">
      <div style="font-size:13px;color:#9ca3af;padding:8px 0;">Loading status...</div>
    </div>
  </div>

  <!-- Commit -->
  <div class="card">
    <div class="card-title">Commit</div>
    <textarea class="msg-textarea" id="commit-msg" placeholder="Commit message — e.g. Add Best Horror Movies article"></textarea>
    <div class="select-all-row">
      <a id="select-all">Select all</a> · <a id="deselect-all">Deselect all</a>
      <span style="margin-left:auto;color:#9ca3af;" id="selected-count">0 files selected</span>
    </div>
    <div class="file-list" id="commit-file-list">
      <div style="font-size:13px;color:#9ca3af;">Load status first</div>
    </div>
    <button class="action-btn" id="commit-btn" disabled>
      <div class="btn-spinner"></div>
      <span id="commit-btn-label">Commit</span>
    </button>
    <div class="result-msg" id="commit-msg-result"></div>
  </div>

  <!-- Push -->
  <div class="card">
    <div class="card-title">Push</div>
    <div class="push-row">
      <div class="push-status-text" id="push-status-text">Load status to see push info</div>
      <button class="action-btn push" id="push-btn" disabled>
        <div class="btn-spinner"></div>
        <span id="push-btn-label">Push to origin</span>
      </button>
    </div>
    <div class="result-msg" id="push-msg-result"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'http://localhost:3002';
  let gitStatus = null;

  function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type ? ' ' + type : '');
    setTimeout(() => t.className = 'toast', 2800);
  }

  function statusClass(s) {
    if (s === 'M' || s === 'MM') return 'fs-M';
    if (s === 'A' || s === 'AM') return 'fs-A';
    if (s === 'D') return 'fs-D';
    return 'fs-other';
  }

  function renderFileList(files) {
    if (!files.length) {
      document.getElementById('file-list').innerHTML = '<div class="no-changes">No uncommitted changes</div>';
      document.getElementById('commit-file-list').innerHTML = '<div class="no-changes">Nothing to commit</div>';
      document.getElementById('commit-btn').disabled = true;
      return;
    }

    // Status card file list (read-only display)
    document.getElementById('file-list').innerHTML = files.map(f =>
      `<div class="file-item">
        <span class="file-status ${statusClass(f.status)}">${esc(f.status)}</span>
        <span class="file-path" title="${esc(f.path)}">${esc(f.path)}</span>
      </div>`
    ).join('');

    // Commit card file list (with checkboxes)
    document.getElementById('commit-file-list').innerHTML = files.map(f =>
      `<div class="file-item">
        <input type="checkbox" class="file-check commit-check" data-path="${esc(f.path)}" checked>
        <span class="file-status ${statusClass(f.status)}">${esc(f.status)}</span>
        <span class="file-path" title="${esc(f.path)}">${esc(f.path)}</span>
      </div>`
    ).join('');

    document.querySelectorAll('.commit-check').forEach(cb => {
      cb.addEventListener('change', updateSelectedCount);
    });
    updateSelectedCount();
    document.getElementById('commit-btn').disabled = false;
  }

  function updateSelectedCount() {
    const checked = document.querySelectorAll('.commit-check:checked').length;
    document.getElementById('selected-count').textContent = `${checked} file${checked !== 1 ? 's' : ''} selected`;
    document.getElementById('commit-btn').disabled = checked === 0;
  }

  function getSelectedFiles() {
    return [...document.querySelectorAll('.commit-check:checked')].map(cb => cb.dataset.path);
  }

  document.getElementById('select-all').addEventListener('click', () => {
    document.querySelectorAll('.commit-check').forEach(cb => cb.checked = true);
    updateSelectedCount();
  });
  document.getElementById('deselect-all').addEventListener('click', () => {
    document.querySelectorAll('.commit-check').forEach(cb => cb.checked = false);
    updateSelectedCount();
  });

  async function loadStatus() {
    const refreshBtn = document.getElementById('refresh-btn');
    refreshBtn.disabled = true;
    refreshBtn.textContent = 'Loading...';
    try {
      const resp = await fetch(`${API}/api/git/status`);
      if (!resp.ok) throw new Error('Failed to get status');
      gitStatus = await resp.json();

      // Branch
      document.getElementById('branch-badge').innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M6 9v6M9 6h3a3 3 0 0 1 3 3v3"/></svg>
        ${esc(gitStatus.branch)}
      `;

      // Ahead
      const aheadBadge = document.getElementById('ahead-badge');
      if (gitStatus.ahead > 0) {
        aheadBadge.className = 'ahead-badge';
        aheadBadge.textContent = `↑ ${gitStatus.ahead} ahead`;
        document.getElementById('push-btn').disabled = false;
        document.getElementById('push-status-text').innerHTML = `<strong>${gitStatus.ahead} commit${gitStatus.ahead !== 1 ? 's' : ''}</strong> ahead of origin/${esc(gitStatus.branch)}`;
      } else {
        aheadBadge.className = 'ahead-badge none';
        aheadBadge.textContent = 'Up to date';
        document.getElementById('push-btn').disabled = true;
        document.getElementById('push-status-text').innerHTML = `Up to date with <strong>origin/${esc(gitStatus.branch)}</strong>`;
      }

      renderFileList(gitStatus.files || []);
    } catch (err) {
      document.getElementById('file-list').innerHTML = `<div style="color:#ef4444;font-size:13px;">${esc(err.message)}</div>`;
      showToast('Failed to load git status', 'error');
    } finally {
      refreshBtn.disabled = false;
      refreshBtn.textContent = 'Refresh';
    }
  }

  document.getElementById('refresh-btn').addEventListener('click', loadStatus);

  // Commit
  document.getElementById('commit-btn').addEventListener('click', async () => {
    const message = document.getElementById('commit-msg').value.trim();
    const files = getSelectedFiles();
    if (!message) {
      document.getElementById('commit-msg').focus();
      document.getElementById('commit-msg').style.borderColor = '#ef4444';
      setTimeout(() => document.getElementById('commit-msg').style.borderColor = '', 1500);
      return;
    }
    if (!files.length) { showToast('Select at least one file', 'error'); return; }

    const btn = document.getElementById('commit-btn');
    btn.disabled = true;
    btn.classList.add('spinning');
    document.getElementById('commit-btn-label').textContent = 'Committing...';
    document.getElementById('commit-msg-result').textContent = '';

    try {
      const resp = await fetch(`${API}/api/git/commit`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, files }),
      });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || 'Commit failed');
      }
      document.getElementById('commit-msg-result').textContent = `✓ Committed ${files.length} file${files.length !== 1 ? 's' : ''}`;
      document.getElementById('commit-msg-result').className = 'result-msg ok';
      document.getElementById('commit-msg').value = '';
      showToast('Committed', 'success');
      await loadStatus();
    } catch (err) {
      document.getElementById('commit-msg-result').textContent = err.message;
      document.getElementById('commit-msg-result').className = 'result-msg err';
      showToast('Commit failed', 'error');
    } finally {
      btn.disabled = false;
      btn.classList.remove('spinning');
      document.getElementById('commit-btn-label').textContent = 'Commit';
    }
  });

  // Push
  document.getElementById('push-btn').addEventListener('click', async () => {
    if (!confirm('Push to origin? Make sure your changes are committed first.')) return;

    const btn = document.getElementById('push-btn');
    btn.disabled = true;
    btn.classList.add('spinning');
    document.getElementById('push-btn-label').textContent = 'Pushing...';
    document.getElementById('push-msg-result').textContent = '';

    try {
      const resp = await fetch(`${API}/api/git/push`, { method: 'POST' });
      if (!resp.ok) {
        const err = await resp.json().catch(() => ({}));
        throw new Error(err.error || 'Push failed');
      }
      document.getElementById('push-msg-result').textContent = '✓ Pushed successfully';
      document.getElementById('push-msg-result').className = 'result-msg ok';
      showToast('Pushed to origin', 'success');
      await loadStatus();
    } catch (err) {
      document.getElementById('push-msg-result').textContent = err.message;
      document.getElementById('push-msg-result').className = 'result-msg err';
      showToast('Push failed', 'error');
    } finally {
      btn.disabled = false;
      btn.classList.remove('spinning');
      document.getElementById('push-btn-label').textContent = 'Push to origin';
    }
  });

  loadStatus();
</script>
</body>
</html>
